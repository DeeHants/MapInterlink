<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>MapInterlink</title>

        body {
            font-family: Arial, sans-serif;
            min-width: 320px;
            padding: 12px
        }

        .label {
            font-weight: 600;
            margin-top: 8px
        }

        .value {

    <script src="map_urls.js"></script>
